<button (click)="toggleMenu()" class="lg:hidden p-4 text-white">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
  </svg>
</button>

<div class="flex min-h-screen">
  <aside [class.hidden]="!isMenuOpen" class="w-64 min-h-screen bg-[#1e293b] border-r border-slate-700 p-6 flex flex-col lg:flex">

    <!-- Logo -->
    <div class="flex items-center space-x-2 mb-10">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
      </div>
      <h1 class="text-white font-bold text-xl tracking-tight">AssetFlow</h1>
    </div>

    <!-- Navegação -->
    <nav class="flex flex-col space-y-2 flex-1">
      <a routerLink="/app/dashboard" routerLinkActive="bg-blue-600/20 text-blue-400"
         class="flex items-center space-x-3 p-3 rounded-lg text-slate-400 hover:bg-slate-800 transition-all">
        <span>📊 Dashboard</span>
      </a>
      <a routerLink="/app/equipamentos" routerLinkActive="bg-blue-600/20 text-blue-400"
         class="flex items-center space-x-3 p-3 rounded-lg text-slate-400 hover:bg-slate-800 transition-all">
        <span>📋 Equipamentos</span>
      </a>
      <a routerLink="/app/planos" routerLinkActive="bg-blue-600/20 text-blue-400"
         class="flex items-center space-x-3 p-3 rounded-lg text-slate-400 hover:bg-slate-800 transition-all">
        <span>🔧 Planos</span>
      </a>
    </nav>

    <!-- Usuário + Logout -->
    <div class="border-t border-slate-700 pt-4 mt-4">
      @if (currentUser) {
        <div class="mb-3 px-1">
          <p class="text-sm font-medium text-white truncate">{{ currentUser.nome }}</p>
          <p class="text-xs text-slate-500 truncate">{{ perfilLabel }}</p>
        </div>
      }
      <button
        (click)="logout()"
        class="w-full flex items-center gap-2 p-3 rounded-lg text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition-all text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Sair
      </button>
    </div>
  </aside>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
