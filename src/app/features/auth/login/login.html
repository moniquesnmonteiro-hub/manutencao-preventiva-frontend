<div class="min-h-screen bg-[#0f172a] flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Logo e título -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-blue-500/30">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">PreventivaPIM</h1>
      <p class="text-slate-400 text-sm mt-1">Sistema de Manutenção Preventiva</p>
    </div>

    <!-- Card de login -->
    <div class="bg-[#1e293b] rounded-2xl border border-slate-700 shadow-2xl p-8">
      <h2 class="text-lg font-semibold text-white mb-1">Bem-vindo de volta</h2>
      <p class="text-slate-400 text-sm mb-6">Faça login para acessar o sistema</p>

      <!-- Mensagem de erro -->
      @if (errorMsg) {
        <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3 mb-5">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>{{ errorMsg }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1.5">E-mail</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="seu@email.com"
            class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500
                   focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all" />
        </div>

        <!-- Senha -->
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1.5">Senha</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-2.5 pr-11 text-white placeholder-slate-500
                     focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all" />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
              @if (showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Botão de login -->
        <button
          type="submit"
          [disabled]="isLoading || loginForm.invalid"
          class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500
                 text-white font-semibold py-2.5 rounded-lg transition-all shadow-lg shadow-blue-500/20
                 flex items-center justify-center gap-2 mt-2">
          @if (isLoading) {
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            Entrando...
          } @else {
            Entrar
          }
        </button>

      </form>
    </div>

    <p class="text-center text-slate-600 text-xs mt-6">
      Polo Industrial de Manaus &mdash; Sistema de Gestão de Ativos
    </p>
  </div>
</div>
