<!-- Container principal com fundo escuro. -->
<div class="min-h-screen bg-[#0f172a] p-8">
  <!-- Área centralizada com largura máxima. -->
  <div class="max-w-lg mx-auto">

    <!-- Cabeçalho da página. -->
    <div class="mb-8">
      <!-- Título. -->
      <h2 class="text-2xl font-light text-white tracking-tight">Novo Usuário</h2>
      <!-- Subtítulo. -->
      <p class="text-slate-400 text-sm mt-1">Cadastre um técnico ou supervisor no sistema</p>
    </div>

    <!-- Card do formulário. -->
    <div class="bg-[#1e293b] rounded-2xl border border-slate-700 p-6 space-y-5">

      <!-- Mensagem de sucesso. -->
      @if (sucesso()) {
        <div class="flex items-center gap-2 bg-green-500/10 border border-green-500/30
                    text-green-400 text-sm rounded-lg px-4 py-3">
          <!-- Ícone de check. -->
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Usuário cadastrado com sucesso! Redirecionando...
        </div>
      }

      <!-- Mensagem de erro. -->
      @if (erro()) {
        <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/30
                    text-red-400 text-sm rounded-lg px-4 py-3">
          <!-- Ícone de alerta. -->
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ erro() }}
        </div>
      }

      <!-- Campo: Nome. -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">
          Nome completo
        </label>
        <input
          type="text"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Ex: João da Silva"
          class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2.5 text-white text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-600" />
      </div>

      <!-- Campo: E-mail. -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">
          E-mail
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="joao@empresa.com"
          class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2.5 text-white text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-600" />
      </div>

      <!-- Campo: Perfil. -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">
          Perfil
        </label>
        <select
          name="perfil"
          [(ngModel)]="perfil"
          class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2.5 text-white text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
          <!-- Loop pelas opções de perfil disponíveis. -->
          @for (opcao of perfisDisponiveis; track opcao.value) {
            <option [value]="opcao.value">{{ opcao.label }}</option>
          }
        </select>
      </div>

      <!-- Divisor da seção de senha. -->
      <div class="border-t border-slate-700 pt-4">
        <p class="text-xs text-slate-500 mb-4">
          Senha inicial — deve ter mínimo 6 caracteres, uma maiúscula, uma minúscula e um caractere especial.
        </p>

        <!-- Campo: Senha. -->
        <div class="mb-4">
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">
            Senha
          </label>
          <div class="relative">
            <input
              [type]="mostrarSenha() ? 'text' : 'password'"
              name="senha"
              [(ngModel)]="senha"
              placeholder="••••••••"
              class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2.5 pr-10 text-white text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-600" />
            <!-- Toggle visibilidade. -->
            <button type="button" (click)="mostrarSenha.set(!mostrarSenha())"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
              @if (mostrarSenha()) {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Campo: Confirmar Senha. -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">
            Confirmar senha
          </label>
          <div class="relative">
            <input
              [type]="mostrarConfirmar() ? 'text' : 'password'"
              name="confirmarSenha"
              [(ngModel)]="confirmarSenha"
              placeholder="••••••••"
              class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-3 py-2.5 pr-10 text-white text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder-slate-600" />
            <!-- Toggle visibilidade. -->
            <button type="button" (click)="mostrarConfirmar.set(!mostrarConfirmar())"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
              @if (mostrarConfirmar()) {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>
      </div>

      <!-- Botões de ação. -->
      <div class="flex gap-3 pt-2">
        <!-- Botão cancelar. -->
        <button
          type="button"
          (click)="cancelar()"
          [disabled]="salvando()"
          class="flex-1 px-4 py-2.5 rounded-lg text-sm text-slate-400 border border-slate-700
                 hover:border-slate-500 hover:text-white transition-all disabled:opacity-50">
          Cancelar
        </button>
        <!-- Botão salvar. -->
        <button
          type="button"
          (click)="salvar()"
          [disabled]="salvando() || sucesso()"
          class="flex-1 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm
                 font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ salvando() ? 'Cadastrando...' : 'Cadastrar usuário' }}
        </button>
      </div>

    </div>
  </div>
</div>
